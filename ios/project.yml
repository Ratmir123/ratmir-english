name: RatmirEnglish
options:
  projectFormat: xcode15_3
  xcodeVersion: '15.4'
  bundleIdPrefix: app.ratmirenglish
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  RatmirEnglish:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ratmirenglish.personal
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: '4'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ratmir English
        NSMicrophoneUsageDescription: Записывать твои ответы для английской практики и разбора.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  RatmirEnglish:
    build:
      targets:
        RatmirEnglish: all
