name: RatmirEnglish
options:
  projectFormat: xcode15_3
  xcodeVersion: '27.0'
  bundleIdPrefix: app.ratmirenglish
  developmentLanguage: ru
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  RatmirEnglish:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ratmirenglish.personal
        MARKETING_VERSION: '0.5.5'
        CURRENT_PROJECT_VERSION: '15'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Smooth Talk
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSMicrophoneUsageDescription: Записывать твои ответы в тренировках разговора и созвонах, а в «Послушать» — звук рядом с тобой, чтобы разобрать их.
        # The system launch screen is the app background (Theme.base, light and dark), so the launch layer
        # continues it without a flash (MOTION-PASS 0.5.2 §4).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # PASS-0.5.3 §1.7: the Home Screen quick action opens the capture sheet (AppEntryPoints.swift, cold and warm launch).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: app.ratmirenglish.capture
            UIApplicationShortcutItemTitle: Запомнить фразу
            UIApplicationShortcutItemIconSymbolName: text.badge.plus
  RatmirEnglishTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RatmirEnglish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ratmirenglish.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RatmirEnglish:
    build:
      targets:
        RatmirEnglish: all
    test:
      targets: [RatmirEnglishTests]
