name: iPhone IPA
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/RatmirEnglish.app package/Payload/
          cd package
          zip -qr ../RatmirEnglish.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RatmirEnglish-unsigned-IPA
          path: RatmirEnglish.ipa
          retention-days: 7
          if-no-files-found: error
