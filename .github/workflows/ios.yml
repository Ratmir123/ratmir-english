name: iPhone IPA
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          swift scripts/create-icon.swift Resources/Assets.xcassets/AppIcon.appiconset/icon.png
          xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/RatmirEnglish.app package/Payload/
          cd package
          zip -qr ../RatmirEnglish.ipa Payload
      - name: Verify device bundle metadata
        run: |
          xcodebuild -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -showBuildSettings -json > build-settings.json
          python3 - <<'PY'
          import json, plistlib
          targets = json.load(open('build-settings.json'))
          settings = next(item['buildSettings'] for item in targets if item['target'] == 'RatmirEnglish')
          info = plistlib.load(open('build/Build/Products/Release-iphoneos/RatmirEnglish.app/Info.plist', 'rb'))
          fields = {'CFBundleIdentifier': 'PRODUCT_BUNDLE_IDENTIFIER', 'CFBundleShortVersionString': 'MARKETING_VERSION', 'CFBundleVersion': 'CURRENT_PROJECT_VERSION'}
          for field, setting in fields.items():
              assert info[field] == settings[setting], f'Packaged {field} does not match {setting}'
          print('Verified device bundle:', info['CFBundleIdentifier'], info['CFBundleShortVersionString'], info['CFBundleVersion'])
          PY
      - name: Launch iPhone 11 simulator
        run: |
          xcodebuild -quiet -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and "iOS" in x["name"]]; print(r[-1]["identifier"])')
          device=$(xcrun simctl create 'Training iPhone 11' com.apple.CoreSimulator.SimDeviceType.iPhone-11 "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" simulator-build/Build/Products/Debug-iphonesimulator/RatmirEnglish.app
          xcrun simctl launch "$device" app.ratmirenglish.personal
          sleep 3
          xcrun simctl io "$device" screenshot iPhone11-login.png
          for screen in intro baseline baseline-report home practice listening analysing review celebrate progress settings; do
            xcrun simctl terminate "$device" app.ratmirenglish.personal || true
            xcrun simctl launch "$device" app.ratmirenglish.personal --preview="$screen"
            sleep 3
            xcrun simctl io "$device" screenshot "iPhone11-$screen.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: RatmirEnglish-unsigned-IPA
          path: RatmirEnglish.ipa
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone11-preview
          path: iPhone11-*.png
          retention-days: 7
