name: iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Verify modern Apple SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | head -1 | grep 'Xcode 27'
      - name: Install shader compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          test -f Resources/Assets.xcassets/AppIcon.appiconset/icon-smooth-v042-1024.png
          xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/RatmirEnglish.app package/Payload/
          cd package
          zip -qr ../RatmirEnglish.ipa Payload
      - name: Verify device bundle metadata
        run: |
          xcodebuild -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -showBuildSettings -json > build-settings.json
          python3 - <<'PY'
          import json, plistlib
          targets = json.load(open('build-settings.json'))
          settings = next(item['buildSettings'] for item in targets if item['target'] == 'RatmirEnglish')
          info = plistlib.load(open('build/Build/Products/Release-iphoneos/RatmirEnglish.app/Info.plist', 'rb'))
          fields = {'CFBundleIdentifier': 'PRODUCT_BUNDLE_IDENTIFIER', 'CFBundleShortVersionString': 'MARKETING_VERSION', 'CFBundleVersion': 'CURRENT_PROJECT_VERSION'}
          for field, setting in fields.items():
              assert info[field] == settings[setting], f'Packaged {field} does not match {setting}'
          print('Verified device bundle:', info['CFBundleIdentifier'], info['CFBundleShortVersionString'], info['CFBundleVersion'])
          PY
      # The installable IPA is uploaded before the long simulator captures, so a capture timeout never loses it.
      - uses: actions/upload-artifact@v4
        with:
          name: RatmirEnglish-unsigned-IPA
          path: RatmirEnglish.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Launch iPhone 11 simulator
        run: |
          # simctl recordVideo occasionally never finishes after SIGINT; give it 30 s, then kill it, so one stuck clip can't stall the job.
          stop_recording() { kill -INT "$1" 2>/dev/null || true; for _ in $(seq 1 30); do kill -0 "$1" 2>/dev/null || break; sleep 1; done; kill -9 "$1" 2>/dev/null || true; wait "$1" 2>/dev/null || true; }
          xcodebuild -quiet -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simulator-build CODE_SIGNING_ALLOWED=NO build
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and "iOS" in x["name"]]; print(r[-1]["identifier"])')
          device=$(xcrun simctl create 'Training iPhone 11' com.apple.CoreSimulator.SimDeviceType.iPhone-11 "$runtime")
          echo "TRAINING_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" simulator-build/Build/Products/Debug-iphonesimulator/RatmirEnglish.app
          xcrun simctl launch "$device" app.ratmirenglish.personal
          sleep 3
          xcrun simctl io "$device" screenshot iPhone11-login.png
          for screen in today today-plan pending-recording placement placement-intro placement-listening placement-reading placement-break placement-speaking placement-roleplay placement-scoring placement-result practice-catalog practice-detail conversation listening dictation-preview analysing analysis-error review review-retry pushback celebrate completed rank-up saved-deferred preview-timing ielts-reading ielts-writing calls call-review call-transcript call-speakers patterns facts progress skills history achievements ranks ranks-bottom profile reminder-editor reminder-denied; do
            xcrun simctl terminate "$device" app.ratmirenglish.personal || true
            xcrun simctl launch "$device" app.ratmirenglish.personal --preview="$screen"
            sleep 3
            xcrun simctl io "$device" screenshot "iPhone11-$screen.png"
          done
          xcrun simctl ui "$device" appearance dark
          sleep 3 # the appearance switch lands asynchronously; the first dark capture used to come out light
          for screen in today practice-catalog conversation dictation-preview review pushback calls call-review placement-result progress achievements history profile; do
            xcrun simctl terminate "$device" app.ratmirenglish.personal || true
            xcrun simctl launch "$device" app.ratmirenglish.personal --preview="$screen"
            sleep 3
            xcrun simctl io "$device" screenshot "iPhone11-$screen-dark.png"
          done
          xcrun simctl ui "$device" appearance light
          for appearance in light dark; do
            xcrun simctl ui "$device" appearance "$appearance"
            xcrun simctl terminate "$device" app.ratmirenglish.personal || true
            xcrun simctl launch "$device" app.ratmirenglish.personal --preview=tab-history-round-trip
            xcrun simctl io "$device" recordVideo --codec=h264 "iPhone11-history-$appearance-motion.mp4" &
            recorder=$!
            sleep 9
            stop_recording "$recorder"
            xcrun simctl io "$device" screenshot "iPhone11-tab-history-round-trip-$appearance.png"
          done
          xcrun simctl ui "$device" appearance light
          xcrun simctl terminate "$device" app.ratmirenglish.personal || true
          xcrun simctl launch "$device" app.ratmirenglish.personal --preview=conversation
          xcrun simctl io "$device" recordVideo --codec=h264 iPhone11-companion-motion.mp4 &
          recorder=$!
          sleep 8
          stop_recording "$recorder"
          xcrun simctl terminate "$device" app.ratmirenglish.personal || true
          xcrun simctl launch "$device" app.ratmirenglish.personal --preview=dictation-preview
          xcrun simctl io "$device" recordVideo --codec=h264 iPhone11-dictation-motion.mp4 &
          recorder=$!
          sleep 8
          stop_recording "$recorder"
          # Capture the complete greeting, soft handoff and Today cascade.
          xcrun simctl terminate "$device" app.ratmirenglish.personal || true
          xcrun simctl io "$device" recordVideo --codec=h264 iPhone11-opening-motion.mp4 &
          recorder=$!
          sleep 0.2
          xcrun simctl launch "$device" app.ratmirenglish.personal --preview=opening
          sleep 7
          stop_recording "$recorder"
          xcrun simctl io "$device" screenshot iPhone11-opening.png
          for screen in achievements ranks completed rank-up; do
            xcrun simctl terminate "$device" app.ratmirenglish.personal || true
            xcrun simctl io "$device" recordVideo --codec=h264 "iPhone11-$screen-motion.mp4" &
            recorder=$!
            sleep 0.2
            xcrun simctl launch "$device" app.ratmirenglish.personal --preview="$screen"
            sleep 6
            stop_recording "$recorder"
          done
      - name: Test native completion and audio policy
        run: |
          device="$TRAINING_SIMULATOR"
          xcodebuild -quiet -project ios/RatmirEnglish.xcodeproj -scheme RatmirEnglish -configuration Debug -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -collect-test-diagnostics never -derivedDataPath simulator-build -resultBundlePath native-tests.xcresult CODE_SIGNING_ALLOWED=NO test
          xcrun xcresulttool get test-results summary --schema --path native-tests.xcresult > native-tests-summary-schema.json
          xcrun xcresulttool get test-results summary --path native-tests.xcresult > native-tests-summary.json
          python3 - <<'PY'
          import json
          summary = json.load(open('native-tests-summary.json'))
          assert summary['result'] == 'Passed' and summary['totalTestCount'] == 58, summary
          assert type(summary['passedTests']) is int and summary['passedTests'] == 58, summary
          assert summary['failedTests'] == 0 and summary['skippedTests'] == 0, summary
          assert not summary['testFailures'] and summary.get('expectedFailures', 0) == 0, summary
          print('Verified native tests: 58 passed, none failed or skipped')
          PY
          for screen in today achievements ranks-bottom reminder-editor review preview-timing dictation-preview conversation practice-detail; do
            xcrun simctl terminate "$device" app.ratmirenglish.personal || true
            xcrun simctl launch "$device" app.ratmirenglish.personal --preview="$screen" --large-type
            sleep 3
            xcrun simctl io "$device" screenshot "iPhone11-$screen-large.png"
          done
      - name: Verify preview capture inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          images = list(Path('.').glob('iPhone11-*.png'))
          movies = list(Path('.').glob('iPhone11-*-motion.mp4'))
          assert len(images) == 70, [p.name for p in images]
          assert all(p.stat().st_size > 1024 for p in images), 'A preview screenshot is empty or incomplete'
          # Motion clips are review aids: a clip stopped by the recording watchdog is reported, not fatal.
          complete = [p for p in movies if p.stat().st_size > 1024]
          if len(complete) != 9: print('::warning::motion recordings complete:', len(complete), 'of 9')
          print('Verified previews: 70 PNG screenshots,', len(complete), 'motion recordings')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: |
            native-tests.xcresult
            native-tests-summary.json
            native-tests-summary-schema.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone11-preview
          path: |
            iPhone11-*.png
            iPhone11-*-motion.mp4
          retention-days: 7
